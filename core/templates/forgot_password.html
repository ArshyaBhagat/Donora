{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password – Donora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: row;
      min-height: 100vh;
      width: 100%;
    }

    .left {
      width: 50%;
      background-color: #EAF4FF;
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .left .logo img {
      width: 180px;
      margin-bottom: 10px;
    }

    .left .welcome h1 {
      font-size: 32px;
      color: #1A237E;
      margin-bottom: 20px;
    }

    .left .welcome p {
      font-size: 18px;
      color: #2A70B8;
      max-width: 90%;
      line-height: 1.5;
    }

    .left .plant {
      width: 300px;
      margin-top: 20px;
      border-radius: 12px;
    }

    .right {
      width: 50%;
      background-color: #EAF4FF;
      background-image: url('{% static "images/leaves.png" %}');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .form-box {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(135deg, #1A237E, #2A70B8);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-box h2 {
      color: #ffffff;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .form-box label {
      color: #ffffff;
      align-self: flex-start;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    .form-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 60px;
      border: 1px solid #90A4AE;
    }

    .form-box input[type="submit"] {
      background-color: #43A047;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 15px;
    }

    .form-box input[type="submit"]:hover {
      background-color: #388E3C;
    }

    .message {
      font-size: 16px;
      text-align: center;
      margin-bottom: 10px;
    }

    .message.error {
      color: red;
    }

    .message.success {
      color: lightgreen;
    }

    .message.info {
      color: #fff8c6;
    }

    /* Responsive Design */
    @media screen and (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .left, .right {
        width: 100%;
        height: auto;
        padding: 2rem;
      }

      .left .logo img {
        width: 140px;
      }

      .left .plant {
        width: 200px;
      }

      .form-box {
        width: 100%;
        padding: 20px;
      }

      .form-box h2 {
        font-size: 20px;
      }

      .form-box input[type="submit"] {
        font-size: 14px;
      }
    }

    @media screen and (max-width: 480px) {
      .left .welcome h1 {
        font-size: 24px;
      }

      .left .welcome p {
        font-size: 16px;
      }

      .form-box h2 {
        font-size: 18px;
      }

      .form-box input {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- LEFT SECTION -->
    <div class="left">
      <div class="logo">
        <img src="{% static 'images/logo.png' %}" alt="Logo">
      </div>
      <div class="welcome">
        <h1>Reset Your Password</h1>
        <p>Forgot your password? Don’t worry — we’ll help you set a new one.</p>
      </div>
      <img src="{% static 'images/plant.jpg' %}" class="plant" alt="Plant">
    </div>

    <!-- RIGHT SECTION -->
    <div class="right">
      <div class="form-box">
        <h2>Forgot Password</h2>

        {% if messages %}
          {% for message in messages %}
            <div class="message {% if 'error' in message.tags %}error{% elif 'success' in message.tags %}success{% else %}info{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <label>Username</label>
          <input type="text" name="username" placeholder="Enter your username">

          <label>New Password</label>
          <input type="password" name="new_password" placeholder="New Password">

          <label>Confirm New Password</label>
          <input type="password" name="confirm_password" placeholder="Re-enter Password">

          <input type="submit" value="Reset Password">
        </form>
      </div>
    </div>
  </div>
</body>
</html>
